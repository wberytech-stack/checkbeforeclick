# Gate 006C - signed-in journeys and cross-tenant isolation on the Azure STAGING app.
#
# Trigger : workflow_dispatch only, from master. Never called by another workflow.
# Approval: the job runs in the GitHub environment staging-auth-test, which the founder
#           creates with themself as required reviewer and deployments limited to
#           master, and which holds the only credentials used here: two pre-created
#           staging test accounts (secrets CBC_TEST_A_* / CBC_TEST_B_*) and, as
#           environment variables, each account's organization_id (founder evidence,
#           CBC_TEST_A_ORG_ID / CBC_TEST_B_ORG_ID). Without them the verifier fails at J0
#           and sends nothing; no scan is created until both accounts sign in, reach
#           /dashboard and are in distinct organizations.
# Access  : no Azure sign-in, no OIDC token, read-only repository token. URLs come from
#           repository variables; the public Supabase key from the deployed /login assets.
# Requests: GET on the staging app; POST only to /api/auth/login (two sign-ins) and
#           /api/scan (ONE localhost scan, completed before any provider runs: no Web
#           Risk, no RDAP lookup, no Inngest event); GET/HEAD on four Supabase data-API
#           tables with each account's own session token. No account is created.
# Data    : one scan row and its evidence row per run, owned by account A. The run
#           prints the scan id and run id (even if later steps fail); the founder
#           deletes them with docs/gates/sql/gate-006c-staging-test-scan-cleanup.sql.
# One attempt, no retries; any failure fails the run.
name: staging-auth-journeys

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-auth-journeys
  cancel-in-progress: false

jobs:
  journeys:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging-auth-test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: Offline self-test of the journey verifier (no network)
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/azure-hosting/test-staging-auth-journeys.ts

      - name: Signed-in staging journeys and cross-tenant checks
        shell: bash
        env:
          STG_APP_URL: ${{ vars.CBC_STG_NEXT_PUBLIC_APP_URL }}
          STG_SUPABASE_URL: ${{ vars.CBC_STG_NEXT_PUBLIC_SUPABASE_URL }}
          PROD_APP_URL: ${{ vars.CBC_PROD_NEXT_PUBLIC_APP_URL }}
          PROD_SUPABASE_URL: ${{ vars.CBC_PROD_NEXT_PUBLIC_SUPABASE_URL }}
          CBC_TEST_A_EMAIL: ${{ secrets.CBC_TEST_A_EMAIL }}
          CBC_TEST_A_PASSWORD: ${{ secrets.CBC_TEST_A_PASSWORD }}
          CBC_TEST_B_EMAIL: ${{ secrets.CBC_TEST_B_EMAIL }}
          CBC_TEST_B_PASSWORD: ${{ secrets.CBC_TEST_B_PASSWORD }}
          CBC_TEST_A_ORG_ID: ${{ vars.CBC_TEST_A_ORG_ID }}
          CBC_TEST_B_ORG_ID: ${{ vars.CBC_TEST_B_ORG_ID }}
        run: node scripts/azure-hosting/staging-auth-journeys.mjs
