blockers:
  - id: tls-unverified-on-master
    detail: >-
      On master, src/server/db/postgres.ts uses ssl { rejectUnauthorized: false }
      whenever CBC_DATABASE_SSL != "false". Verified TLS is required before any
      cloud database connection. Fix exists only on local unmerged branch
      gate-003u-postgres-tls-verification.
    evidence:
      - { type: file, ref: "master@b2df476:src/server/db/postgres.ts:29" }
      - { type: commit, ref: 7973f0e }
    verified_at: 2026-10-16
  - id: fast-scan-500-on-master
    detail: >-
      On master, the /api/scan fast path calls recordFastScanResult
      unconditionally; with CBC_DATABASE_URL unset every URL/domain scan fails.
      Fix exists only on local unmerged branch gate-003t-fast-scan-persistence-fail-safe.
    evidence:
      - { type: file, ref: "master@b2df476:app/api/scan/route.ts:155" }
      - { type: file, ref: "master@b2df476:app/api/scan/route.ts:240" }
      - { type: commit, ref: 7ec9019 }
      - { type: commit, ref: 291d81f }
    verified_at: 2026-10-16
    deployed_impact: { status: unverified }
  - id: migration-004-not-applied
