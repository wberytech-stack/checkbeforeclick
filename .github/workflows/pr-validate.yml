# Gate 007A - offline validation for pull requests into master.
#
# Read-only: no secrets, no environment, no cloud credentials, no write permission. It never deploys
# and never touches a database; every suite below runs offline from the checked-out files.
# Trigger : pull_request into master only. Never pull_request_target (which would run with a
#           writable token and repository secrets for code from the PR).
# Install : `npm ci --ignore-scripts` installs package-lock.json exactly, without lifecycle scripts.
#           No `npx <package>` and nothing fetched outside the lockfile.
# Node    : pinned 24.14.0, matching the other workflows and the built-in TypeScript type stripping
#           the suites rely on.
# Actions : pinned to immutable commit SHAs (the v4.4.0 release commits, which the v4 tags pointed to
#           when this workflow first ran green).
# Build   : `next build` with no environment file and no Supabase values (verified to succeed without
#           them); telemetry off. It compiles and type-checks the app; it does not start or deploy it.
name: pr-validate

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: pr-validate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.14.0"

      - name: Install from lockfile (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: TypeScript (tsc --noEmit)
        run: ./node_modules/.bin/tsc --noEmit -p tsconfig.json

      - name: Gate 007A rate limit
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/rate-limit/test-rate-limit.ts

      - name: Gate 007A provider budget
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/rate-limit/test-provider-budget.ts

      - name: Gate 007A scan flow (react-server condition for the server-only marker)
        run: node --conditions=react-server --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/rate-limit/test-scan-flow.ts

      - name: Gate 007A login flow
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/rate-limit/test-login-flow.ts

      - name: Gate 007A worker flow (react-server condition for the server-only marker)
        run: node --conditions=react-server --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/rate-limit/test-worker-flow.ts

      - name: Gate 007A tenant guard
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/rate-limit/test-tenant-guard.ts

      - name: Hosting and workflow safety
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/azure-hosting/test-hosting-safety.ts

      - name: Production build (next build, no secrets, telemetry off)
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: ./node_modules/.bin/next build
