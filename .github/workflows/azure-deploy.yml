# Gate 006B - manual, founder-approved deploy of the web container to Azure
# Container Apps (design: docs/gates/gate-006a-azure-hosting-migration.md section 6).
#
# Trigger : workflow_dispatch ONLY. No push, merge, schedule or PR trigger, so a
#           merge to master never deploys to Azure (AGENTS.md section 20).
# Inert   : every job is skipped unless the repository variable
#           CBC_AZURE_DEPLOY_ENABLED is exactly "enabled" (founder-only setting)
#           AND the run was dispatched from master, so the workflow definition
#           itself is the reviewed one (a dispatch from another branch could
#           otherwise run an edited copy of this file).
# Fail closed:
#   - the commit input must be a full 40-hex SHA reachable from origin/master;
#   - every required variable must be present, or the run fails before any build;
#   - the deploy job runs in the azure-<env> GitHub Environment, which the founder
#     configures with themself as required reviewer. Without that environment the
#     job cannot obtain an Azure token.
# Secrets : none. Azure sign-in is OIDC (federated credential, no client secret).
#           NEXT_PUBLIC_* values are public by definition and are the ONLY build
#           args. Runtime secrets come from Key Vault references in Container Apps.
#
# Repository variables (founder sets; none are secrets):
#   CBC_AZURE_DEPLOY_ENABLED                      "enabled" to arm the workflow
#   CBC_STG_NEXT_PUBLIC_SUPABASE_URL / _ANON_KEY  staging public build values
#   CBC_PROD_NEXT_PUBLIC_SUPABASE_URL / _ANON_KEY production public build values
#   CBC_STG_NEXT_PUBLIC_APP_URL / CBC_PROD_NEXT_PUBLIC_APP_URL  REQUIRED https origin
#     (staging: https://<staging app FQDN>; production: https://checkbeforeclick.com).
#     Unlike Vercel previews, the container's request origin is its bind address
#     (0.0.0.0:3000), so app/auth/callback/route.ts must not fall back to it.
# Environment variables (in azure-staging and azure-production):
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID,
#   AZURE_RESOURCE_GROUP, AZURE_ACR_NAME, AZURE_CONTAINERAPP_NAME
#
# Staging (Gate 006C, single dispatch, one azure-staging approval): build, then the
#   staging job pushes the image and pins its digest, runs a what-if of
#   infra/azure/hosting/staging-app.bicep that scripts/azure-hosting/staging-guard.mjs
#   must pass (fail closed), deploys that template with the same digest, waits for the
#   new revision and health, and re-checks the live configuration (no Web Risk key).
#   The same run creates the app the first time and updates it later. No retries.
# Production keeps the image-only update in the deploy job and never touches Bicep.
name: azure-deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options:
          - staging
          - production
      commit:
        description: "Full 40-character commit SHA on master to deploy"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: azure-deploy-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  build:
    if: vars.CBC_AZURE_DEPLOY_ENABLED == 'enabled' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
    steps:
      - name: Validate inputs and public build configuration (fail closed)
        id: meta
        shell: bash
        env:
          TARGET_ENV: ${{ inputs.environment }}
          COMMIT: ${{ inputs.commit }}
          STG_URL: ${{ vars.CBC_STG_NEXT_PUBLIC_SUPABASE_URL }}
          STG_ANON: ${{ vars.CBC_STG_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PROD_URL: ${{ vars.CBC_PROD_NEXT_PUBLIC_SUPABASE_URL }}
          PROD_ANON: ${{ vars.CBC_PROD_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          STG_APP_URL: ${{ vars.CBC_STG_NEXT_PUBLIC_APP_URL }}
          PROD_APP_URL: ${{ vars.CBC_PROD_NEXT_PUBLIC_APP_URL }}
        run: |
          set -euo pipefail
          case "$TARGET_ENV" in
            staging)    url="$STG_URL";  anon="$STG_ANON";  app="$STG_APP_URL";  suffix=stg ;;
            production) url="$PROD_URL"; anon="$PROD_ANON"; app="$PROD_APP_URL"; suffix=prod ;;
            *) echo "::error::unknown environment '$TARGET_ENV'"; exit 1 ;;
          esac
          if ! [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit must be a full lowercase 40-hex SHA"; exit 1
          fi
          if [ -z "$url" ] || [ -z "$anon" ]; then
            echo "::error::NEXT_PUBLIC Supabase variables for $TARGET_ENV are not set; refusing to build"; exit 1
          fi
          if ! [[ "$app" =~ ^https://[a-z0-9.-]+$ ]]; then
            echo "::error::NEXT_PUBLIC_APP_URL for $TARGET_ENV must be set to an https origin without a path; refusing to build"; exit 1
          fi
          echo "image_tag=${COMMIT}-${suffix}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require the commit to be on origin/master
        shell: bash
        env:
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/master:refs/remotes/origin/master'
          git cat-file -e "${COMMIT}^{commit}"
          if ! git merge-base --is-ancestor "$COMMIT" origin/master; then
            echo "::error::$COMMIT is not reachable from origin/master; refusing to deploy"; exit 1
          fi
          git checkout --detach "$COMMIT"

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"

      - name: Install from lockfile (no lifecycle scripts)
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Static deploy-safety tests
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON scripts/azure-hosting/test-hosting-safety.ts

      - name: Build image (public build args only)
        shell: bash
        env:
          TARGET_ENV: ${{ inputs.environment }}
          COMMIT: ${{ inputs.commit }}
          IMAGE_TAG: ${{ steps.meta.outputs.image_tag }}
          STG_URL: ${{ vars.CBC_STG_NEXT_PUBLIC_SUPABASE_URL }}
          STG_ANON: ${{ vars.CBC_STG_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          STG_APP_URL: ${{ vars.CBC_STG_NEXT_PUBLIC_APP_URL }}
          PROD_URL: ${{ vars.CBC_PROD_NEXT_PUBLIC_SUPABASE_URL }}
          PROD_ANON: ${{ vars.CBC_PROD_NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          PROD_APP_URL: ${{ vars.CBC_PROD_NEXT_PUBLIC_APP_URL }}
        run: |
          set -euo pipefail
          if [ "$TARGET_ENV" = production ]; then
            url="$PROD_URL"; anon="$PROD_ANON"; app="$PROD_APP_URL"
          else
            url="$STG_URL"; anon="$STG_ANON"; app="$STG_APP_URL"
          fi
          docker build \
            --build-arg NEXT_PUBLIC_SUPABASE_URL="$url" \
            --build-arg NEXT_PUBLIC_SUPABASE_ANON_KEY="$anon" \
            --build-arg NEXT_PUBLIC_APP_URL="$app" \
            --build-arg CBC_BUILD_SHA="$COMMIT" \
            -t "cbc-web:$IMAGE_TAG" .
          docker save "cbc-web:$IMAGE_TAG" | gzip > "$RUNNER_TEMP/cbc-web.tar.gz"

      - uses: actions/upload-artifact@v4
        with:
          name: cbc-web-image
          path: ${{ runner.temp }}/cbc-web.tar.gz
          retention-days: 3

  deploy:
    needs: build
    if: vars.CBC_AZURE_DEPLOY_ENABLED == 'enabled' && github.ref == 'refs/heads/master' && inputs.environment == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: azure-${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Require Azure environment configuration (fail closed)
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_CONTAINERAPP_NAME: ${{ vars.AZURE_CONTAINERAPP_NAME }}
        run: |
          set -euo pipefail
          missing=0
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_ACR_NAME AZURE_CONTAINERAPP_NAME; do
            if [ -z "${!v}" ]; then echo "::error::environment variable $v is not set"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - uses: actions/download-artifact@v4
        with:
          name: cbc-web-image
          path: ${{ runner.temp }}

      - name: Azure sign-in (OIDC, no client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Push image and update Container App
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          ACR: ${{ vars.AZURE_ACR_NAME }}
          APP: ${{ vars.AZURE_CONTAINERAPP_NAME }}
        run: |
          set -euo pipefail
          gunzip -c "$RUNNER_TEMP/cbc-web.tar.gz" | docker load
          server="$(az acr show --name "$ACR" --query loginServer -o tsv)"
          az acr login --name "$ACR"
          docker tag "cbc-web:$IMAGE_TAG" "$server/cbc-web:$IMAGE_TAG"
          docker push "$server/cbc-web:$IMAGE_TAG"
          if ! az containerapp show --name "$APP" --resource-group "$RG" --query name -o tsv >/dev/null 2>&1; then
            echo "::error::Container App $APP not found. Image pushed as $server/cbc-web:$IMAGE_TAG; apply Bicep Phase B with this image (Gate 006B runbook), then re-run."
            exit 1
          fi
          az containerapp update --name "$APP" --resource-group "$RG" \
            --image "$server/cbc-web:$IMAGE_TAG" --output none

      - name: Wait for the NEW revision to be ready and healthy
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          ACR: ${{ vars.AZURE_ACR_NAME }}
          APP: ${{ vars.AZURE_CONTAINERAPP_NAME }}
        run: |
          set -euo pipefail
          server="$(az acr show --name "$ACR" --query loginServer -o tsv)"
          want="$server/cbc-web:$IMAGE_TAG"
          # A 200 from the FQDN alone could come from the OLD revision while the new
          # one is still provisioning or has failed; require the latest revision to
          # run this image and to be the latest READY revision before probing.
          for i in $(seq 1 40); do
            latest="$(az containerapp show --name "$APP" --resource-group "$RG" --query properties.latestRevisionName -o tsv)"
            ready="$(az containerapp show --name "$APP" --resource-group "$RG" --query properties.latestReadyRevisionName -o tsv)"
            image="$(az containerapp show --name "$APP" --resource-group "$RG" --query 'properties.template.containers[0].image' -o tsv)"
            if [ "$image" = "$want" ] && [ -n "$latest" ] && [ "$latest" = "$ready" ]; then
              fqdn="$(az containerapp show --name "$APP" --resource-group "$RG" --query properties.configuration.ingress.fqdn -o tsv)"
              code="$(curl -s -o /dev/null -w '%{http_code}' "https://$fqdn/api/healthz" || true)"
              if [ "$code" = "200" ]; then echo "revision $latest ready with $want; https://$fqdn/api/healthz 200"; exit 0; fi
              echo "attempt $i: revision $latest ready, healthz $code"
            else
              echo "attempt $i: latest=$latest ready=$ready image=$image"
            fi
            sleep 10
          done
          echo "::error::new revision with $want did not become ready and healthy; previous revision keeps serving. Investigate or roll back (founder runbook step R)"
          exit 1

  staging:
    needs: build
    if: vars.CBC_AZURE_DEPLOY_ENABLED == 'enabled' && github.ref == 'refs/heads/master' && inputs.environment == 'staging'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: azure-staging
    permissions:
      id-token: write
      contents: read
    steps:
      # The template and guard come from the commit this workflow runs from (master,
      # the reviewed definition); only the image is built from the requested commit.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Require Azure environment configuration matching the template (fail closed)
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
          AZURE_CONTAINERAPP_NAME: ${{ vars.AZURE_CONTAINERAPP_NAME }}
        run: |
          set -euo pipefail
          missing=0
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_RESOURCE_GROUP AZURE_ACR_NAME AZURE_CONTAINERAPP_NAME; do
            if [ -z "${!v}" ]; then echo "::error::environment variable $v is not set"; missing=1; fi
          done
          [ "$missing" -eq 0 ] || exit 1
          params=infra/azure/hosting/main.parameters.json
          if [ "$AZURE_CONTAINERAPP_NAME" != "$(jq -r .parameters.stagingAppName.value "$params")" ] ||
             [ "$AZURE_ACR_NAME" != "$(jq -r .parameters.registryName.value "$params")" ]; then
            echo "::error::azure-staging AZURE_CONTAINERAPP_NAME / AZURE_ACR_NAME do not match the staging app and registry in main.parameters.json"; exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          name: cbc-web-image
          path: ${{ runner.temp }}

      - name: Azure sign-in (OIDC, no client secret)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # The digest is read from the image this job pushed (RepoDigests), not looked up by
      # tag, so the what-if, the deployment and the checks all use exactly the built image.
      - name: Push the built image and pin its digest
        id: push
        shell: bash
        env:
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          ACR: ${{ vars.AZURE_ACR_NAME }}
        run: |
          set -euo pipefail
          gunzip -c "$RUNNER_TEMP/cbc-web.tar.gz" | docker load
          server="$(az acr show --name "$ACR" --query loginServer -o tsv)"
          az acr login --name "$ACR"
          docker tag "cbc-web:$IMAGE_TAG" "$server/cbc-web:$IMAGE_TAG"
          docker push "$server/cbc-web:$IMAGE_TAG"
          ref="$(docker inspect --format '{{index .RepoDigests 0}}' "$server/cbc-web:$IMAGE_TAG")"
          if ! [[ "$ref" =~ ^"$server"/cbc-web@sha256:[0-9a-f]{64}$ ]]; then echo "::error::could not pin the pushed image digest"; exit 1; fi
          echo "image_ref=$ref" >> "$GITHUB_OUTPUT"
          echo "pushed $server/cbc-web:$IMAGE_TAG as $ref"

      # Fail closed before any infrastructure change: the only allowed change is a Create
      # or Modify of the staging app with no Web Risk key, the flag "false", scale 0..1
      # and the pinned image. Anything else, including ambiguous output, stops the run.
      - name: What-if of the staging template (changes nothing; checked)
        shell: bash
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINERAPP_NAME }}
          IMAGE_REF: ${{ steps.push.outputs.image_ref }}
        run: |
          set -euo pipefail
          az deployment group what-if --resource-group "$RG" \
            --template-file infra/azure/hosting/staging-app.bicep \
            --parameters image="$IMAGE_REF" \
            --no-pretty-print --output json > "$RUNNER_TEMP/whatif.json"
          node scripts/azure-hosting/staging-guard.mjs whatif "$RUNNER_TEMP/whatif.json" "$APP" "$IMAGE_REF"

      # One attempt only. On failure the run stops with the deployment name; running it
      # again is a new dispatch with its own approval.
      - name: Deploy the staging template with the pinned image digest
        shell: bash
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          IMAGE_REF: ${{ steps.push.outputs.image_ref }}
          COMMIT: ${{ inputs.commit }}
        run: |
          set -euo pipefail
          name="cbc-stg-${COMMIT:0:12}-${GITHUB_RUN_ID}"
          echo "deployment $name"
          az deployment group create --resource-group "$RG" --name "$name" \
            --template-file infra/azure/hosting/staging-app.bicep \
            --parameters image="$IMAGE_REF" --output none

      - name: Wait for the NEW revision to be ready and healthy
        shell: bash
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINERAPP_NAME }}
          IMAGE_REF: ${{ steps.push.outputs.image_ref }}
        run: |
          set -euo pipefail
          want="$IMAGE_REF"
          for i in $(seq 1 40); do
            latest="$(az containerapp show --name "$APP" --resource-group "$RG" --query properties.latestRevisionName -o tsv)"
            ready="$(az containerapp show --name "$APP" --resource-group "$RG" --query properties.latestReadyRevisionName -o tsv)"
            image="$(az containerapp show --name "$APP" --resource-group "$RG" --query 'properties.template.containers[0].image' -o tsv)"
            if [ "$image" = "$want" ] && [ -n "$latest" ] && [ "$latest" = "$ready" ]; then
              fqdn="$(az containerapp show --name "$APP" --resource-group "$RG" --query properties.configuration.ingress.fqdn -o tsv)"
              code="$(curl -s -o /dev/null -w '%{http_code}' "https://$fqdn/api/healthz" || true)"
              if [ "$code" = "200" ]; then echo "revision $latest ready with $want; https://$fqdn/api/healthz 200"; exit 0; fi
              echo "attempt $i: revision $latest ready, healthz $code"
            else
              echo "attempt $i: latest=$latest ready=$ready"
            fi
            sleep 10
          done
          echo "::error::staging revision with $want did not become ready and healthy. Check the revision system logs (Key Vault reference resolution, image pull) before a new dispatch"
          exit 1

      - name: Post-deploy configuration check (read-only; no Web Risk key)
        shell: bash
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP: ${{ vars.AZURE_CONTAINERAPP_NAME }}
          IMAGE_REF: ${{ steps.push.outputs.image_ref }}
        run: |
          set -euo pipefail
          az containerapp show --name "$APP" --resource-group "$RG" --output json > "$RUNNER_TEMP/app.json"
          node scripts/azure-hosting/staging-guard.mjs config "$RUNNER_TEMP/app.json" "$IMAGE_REF"
