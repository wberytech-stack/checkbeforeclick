blockers:
  - id: tls-unverified-on-master
    detail: >-
      On master, src/server/db/postgres.ts uses ssl { rejectUnauthorized: false }
      whenever CBC_DATABASE_SSL != "false". Verified TLS is required before any
      cloud database connection. Fix exists only on local unmerged branch
      gate-003u-postgres-tls-verification.
    evidence:
      - { type: file, ref: "master:src/server/db/postgres.ts:29" }
      - { type: commit, ref: 7973f0e }
    verified_at: 2026-10-16
  - id: fast-scan-500-on-master
    detail: >-
      On master, the /api/scan fast path calls recordFastScanResult
      unconditionally; with CBC_DATABASE_URL unset every URL/domain scan fails.
      Fix exists only on local unmerged branch gate-003t-fast-scan-persistence-fail-safe.
    evidence:
      - { type: file, ref: "master:app/api/scan/route.ts:155" }
      - { type: file, ref: "master:app/api/scan/route.ts:240" }
      - { type: commit, ref: 7ec9019 }
      - { type: commit, ref: 291d81f }
    verified_at: 2026-10-16
    deployed_impact: { status: unverified }
  - id: migration-004-not-applied
    detail: Migration 004 is not applied to any real database.
    evidence:
      - { type: gate_doc, ref: docs/gates/gate-003o-runtime-route-wiring-plan.md }
      - { type: gate_doc, ref: docs/gates/gate-003p-scan-result-persistence-helper.md }
    verified_at: 2026-10-15
    live_database_state: { status: unverified }
  - id: migration-003-on-cbc-prod
    detail: No repository record of migration 003 being applied to cbc_prod.
    evidence: []
    live_database_state: { status: unverified }
  - id: runtime-env-unset
    detail: CBC_DATABASE_URL is not set and cbc_app does not exist in any real environment.
    evidence:
      - { type: gate_doc, ref: docs/gates/gate-003o-runtime-route-wiring-plan.md }
      - { type: file, ref: docs/azure/gate-003-runtime-role-runbook.md }
    verified_at: 2026-10-15
    live_environment_state: { status: unverified }
  - id: supabase-authenticated-e2e-outstanding
    detail: Real Supabase-authenticated end-to-end validation of /api/scan (Gate 003R scenarios 1-4) has not been run.
    evidence: [{ type: commit, ref: 7ec9019 }]
    verified_at: 2026-10-16
  - id: split-database-path
    detail: >-
      Scan lifecycle uses Supabase; the terminal write helper uses
      CBC_DATABASE_URL. Must be resolved (Gate 003S decision D1) before
      application activation.
    evidence:
      - { type: file, ref: lib/data/index.ts }
      - { type: file, ref: app/api/scan/route.ts }
      - { type: file, ref: src/server/scan/recordFastScanResult.ts }
      - { type: commit, ref: b192977 }
    verified_at: 2026-10-15
  - id: memberships-precondition
    detail: Migration 004 requires a memberships row; getUserOrgContext reads users.organization_id only (Gate 003S decision D4).
    evidence:
      - { type: file, ref: infra/db/migrations/004_fast_path_function_write_expansion.sql }
      - { type: file, ref: lib/data/index.ts }
    verified_at: 2026-10-15

